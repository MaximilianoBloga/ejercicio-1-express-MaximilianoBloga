<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contacto</title>
</head>
<body>
  <h1>Formulario de Contacto</h1>

  <input type="text" id="nombre" placeholder="Tu nombre" /><br>
  <input type="email" id="email" placeholder="Tu email" /><br>
  <textarea id="mensaje" placeholder="Tu mensaje"></textarea><br>
  <button onclick="enviar()">Enviar</button>

  <p id="respuesta"></p>

  <script>
    async function enviar() {
      const nombre = document.getElementById('nombre').value;
      const email = document.getElementById('email').value;
      const mensaje = document.getElementById('mensaje').value;

      const res = await fetch('/api/contacto', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, email, mensaje })
      });

      const data = await res.json();
      document.getElementById('respuesta').textContent = data.respuesta;
    }
  </script>
</body>
</html>
